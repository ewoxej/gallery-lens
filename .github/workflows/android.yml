name: Android Release

# Signing: set these repository secrets. Without them the build still runs but
# produces *-unsigned.apk (not installable as a release).
#   KEYSTORE_BASE64   - `base64 -w0 release.jks` of your keystore
#   KEYSTORE_PASSWORD - keystore (store) password
#   KEY_ALIAS         - key alias inside the keystore
#   KEY_PASSWORD      - key password

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF#refs/tags/}"; V="${V#v}"
            TAG="${GITHUB_REF#refs/tags/}"     # real release, e.g. v0.2.0
          else
            V="0.0.${GITHUB_RUN_NUMBER}"
            TAG="dev"                          # rolling prerelease for manual runs
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building version $V (code ${GITHUB_RUN_NUMBER}) -> release tag $TAG"

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/release.jks"

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-lens-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publishes a proper GitHub Release with the APKs attached (direct,
      # shareable download links) — for tag pushes AND manual runs. Manual runs
      # go to a rolling "dev" prerelease that is overwritten each time, so its
      # link stays stable; pushing a v* tag cuts a real, non-prerelease release.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Gallery Lens ${{ steps.ver.outputs.name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
