name: Android Release

# Signing: set these repository secrets. Without them the build still runs but
# produces *-unsigned.apk (not installable as a release).
#   KEYSTORE_BASE64   - `base64 -w0 release.jks` of your keystore
#   KEYSTORE_PASSWORD - keystore (store) password
#   KEY_ALIAS         - key alias inside the keystore
#   KEY_PASSWORD      - key password

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Drop the obsolete "tools" package (removed from recent cmdline-tools,
          # which makes the action's default `tools platform-tools` fail).
          packages: platform-tools

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF#refs/tags/}"; V="${V#v}"
            TAG="${GITHUB_REF#refs/tags/}"     # pushed tag, e.g. v0.2.0
          else
            V="$(head -n1 "${GITHUB_WORKSPACE}/VERSION" | tr -d '[:space:]')"
            TAG="v$V"                          # version from VERSION, e.g. v1.0.0
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building version $V (code ${GITHUB_RUN_NUMBER}) -> release tag $TAG"

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/release.jks"

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-lens-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Re-running with the same VERSION replaces that version's release cleanly:
      # wipe the existing release AND its tag first (old assets gone, tag moved to
      # this commit), so there are never stale assets. Only for manual runs; a
      # pushed v* tag is never deleted. Bumping VERSION just makes a new tag.
      - name: Replace existing release for this version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.ver.outputs.tag }}" --cleanup-tag --yes || true

      # Publishes a GitHub Release tagged with the version (from VERSION on manual
      # runs, or the pushed tag), with the signed APKs attached as direct,
      # shareable download links.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Gallery Lens ${{ steps.ver.outputs.name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
